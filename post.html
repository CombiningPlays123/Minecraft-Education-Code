</head>
<body data-page="post" class="loading">
<div id="nav"></div>
<main>
<div class="container page">
<div class="page-head"><div><h1>Post a World</h1><p>Share your Minecraft Education multiplayer join code.</p></div></div>
<div class="card form-card"><div id="msg" class="form-msg hidden" role="alert"></div>
<form id="post-form" novalidate>
<div class="field"><label for="world_name">World name</label><input class="input" id="world_name" maxlength="60" required placeholder="e.g. Science Class Build Lab"><div class="hint"><span>3-60 characters</span></div></div>
<div class="field"><label for="join_code">Minecraft Education join code</label><input class="input" id="join_code" maxlength="120" required autocomplete="off" placeholder="Paste the join code from your world"><div class="hint"><span>In Minecraft Education, open your world and choose Share to get the code.</span></div></div>
<div class="field"><label for="description">Short description</label><textarea class="input" id="description" maxlength="300" required placeholder="What is this world about? Who is it for?"></textarea><div class="hint"><span></span><span id="desc-count">0/300</span></div></div>
<button id="submit" class="btn btn-primary btn-lg" type="submit">Post World</button>
</form></div></div>
</main>
<footer class="footer"><div class="container">Block Together is a community project for Minecraft Education multiplayer. Not affiliated with Mojang or Microsoft.</div></footer>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
